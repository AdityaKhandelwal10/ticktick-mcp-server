[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticktick-mcp"
version = "0.1.0"
description = "MCP server for TickTick task management"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Aditya" }
]
dependencies = [
    "mcp>=0.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/ticktick-mcp"

[project.scripts]
ticktick-mcp = "ticktick_mcp.__main__:main"

